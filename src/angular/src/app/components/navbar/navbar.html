<nav class="sticky top-0 z-50 transition-all duration-500 ease-in-out"
     [ngClass]="scrolled ? 'bg-white/80 backdrop-blur-xl shadow-md border-b border-gray-200/50' : 'bg-white/50 backdrop-blur-sm border-b border-transparent'">
  <div class="flex justify-center items-center w-full px-6 md:px-12 transition-all duration-500 ease-in-out"
       [ngClass]="scrolled ? 'h-[60px]' : 'h-[88px]'">
    <div class="flex items-center w-full max-w-[1200px] justify-between">
      <a routerLink="/" class="flex items-center gap-2 group">
        <div class="w-8 h-8 rounded-full bg-black text-white flex items-center justify-center font-bold text-lg group-hover:scale-105 transition-transform duration-300 shadow-lg">
          H
        </div>
        <span class="font-bold text-xl tracking-tight text-gray-900 group-hover:text-black transition-colors">
          HOP Shop
        </span>
      </a>

      <div class="hidden lg:flex gap-8 items-center">
        @if (!isAdmin) {
          <a routerLink="/" routerLinkActive="!text-black is-active" [routerLinkActiveOptions]="{exact: true}" class="relative text-sm font-semibold tracking-wide uppercase transition-colors duration-300 text-gray-500 hover:text-black">
            Home
          </a>
          <a routerLink="/shop" routerLinkActive="!text-black is-active" class="relative text-sm font-semibold tracking-wide uppercase transition-colors duration-300 text-gray-500 hover:text-black">
            Shop
          </a>
        }

        @if (userLabel) {
          @if (!isAdmin) {
            <a routerLink="/cart" routerLinkActive="!text-black is-active" class="relative text-sm font-semibold tracking-wide uppercase transition-colors duration-300 text-gray-500 hover:text-black">
              Cart
            </a>
            <a routerLink="/orders" routerLinkActive="!text-black is-active" class="relative text-sm font-semibold tracking-wide uppercase transition-colors duration-300 text-gray-500 hover:text-black">
              Orders
            </a>
            <a routerLink="/account" routerLinkActive="!text-black is-active" class="relative text-sm font-semibold tracking-wide uppercase transition-colors duration-300 text-gray-500 hover:text-black">
              {{ userLabel }}
            </a>
          } @else {
            <a routerLink="/admin" routerLinkActive="!text-black is-active" class="relative text-sm font-semibold tracking-wide uppercase transition-colors duration-300 text-gray-500 hover:text-black">
              Admin Dashboard
            </a>
          }
        } @else {
          <a routerLink="/login" routerLinkActive="!text-black is-active" class="relative text-sm font-semibold tracking-wide uppercase transition-colors duration-300 text-gray-500 hover:text-black">
            Login
          </a>
        }
      </div>

      <div class="lg:hidden">
        @if (!isAdmin) {
          <a routerLink="/shop" class="p-2 text-gray-600 hover:text-black transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </a>
        }
      </div>
    </div>
  </div>
</nav>
